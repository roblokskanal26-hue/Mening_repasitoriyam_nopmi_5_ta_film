<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Sahifasi</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Orqa fon rasmi */
            background-image: url('https://img.magnific.com/free-vector/gradient-minimalist-background_23-2149976755.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
            font-family: sans-serif;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            /* Barcha elementlarni o'rtaga tekislash yechimi */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* Mukammal doira shakli */
            object-fit: cover;
            margin-bottom: 10px;
        }

        h1 {
            color: #262ea4;
            margin: 5px 0;
            font-size: 24px;
            text-align: center;
        }

        h3 {
            color: #262ea4;
            margin: 0 0 20px 0;
            font-size: 16px;
            font-weight: normal;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        input {
            width: 220px;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 11px 20px;
            width: 244px; /* input bilan bir xil kenglikda bo'lishi uchun */
            background-color: #2d44ab;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1949b8;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="https://img.magnific.com/free-vector/hacker-operating-laptop-cartoon-icon-illustration-technology-icon-concept-isolated-flat-cartoon-style_138676-2387.jpg?semt=ais_hybrid&w=740&q=80" alt="Hacker Icon">
        <h1>PRE-DEMO DAY</h1>
        <h3>Xush kelibsiz</h3>
        <form action="/login" method="POST">
            <input type="text" name="login" placeholder="Loginni kiriting" required>
            <input type="password" name="password" placeholder="Parolni kiriting" required>
            <button type="submit">Yuborish</button>
        </form>
    </div>

</body>
</html>
